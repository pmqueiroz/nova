[general]
editor = "nano"
bell = "none"
check-updates = true

[theme.font]
size = 16
family = "FiraCode Nerd Font"

[theme.colors]
background = "#0D0D0D"
foreground = "#E5E5E5"
accent = "#82BAFF"
foreground-muted = "#666666"
border = "#FFFFFF12"
cursor = "#82BAFF"

[theme.cursor]
style = "underline"
blink = true

[keybindings]
new-tab = "cmd+t"
close-tab = "cmd+w"
next-tab = "ctrl+tab"
prev-tab = "ctrl+shift+tab"
paste = "cmd+v"
copy = "cmd+c"
open-palette = "cmd+p"
ask-ai = "cmd+k"
settings = "cmd+,"

[ai]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
api_key = ""
